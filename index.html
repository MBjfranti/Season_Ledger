<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Season Ledger · 2026–27</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,500..800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <script>
    /* Set the time-of-day phase before first paint (no flash). Mirrors phaseFor() in atmosphere.js. */
    (function () {
      var d = new Date(), h = d.getHours() + d.getMinutes() / 60, p;
      if (h >= 8 && h < 16.5) p = "day";
      else if (h >= 16.5 && h < 20) p = "golden";
      else if (h >= 5.5 && h < 8) p = "dawn";
      else p = "night";
      document.documentElement.setAttribute("data-phase", p);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
